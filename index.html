<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title> Calculatrice JS</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body>
   
   <div id="particles"></div>


    <script>

        const particles = document.getElementById("particles");

        // Nombre de points
        const nombreDePoints = 100;


        for (let i = 0; i < nombreDePoints; i++) {

            // Création du point
            const point = document.createElement("span");

            point.classList.add("point");


            // Position horizontale aléatoire
            point.style.left = Math.random() * 100 + "%";


            // Taille aléatoire
            const taille = Math.random() * 4 + 2;

            point.style.width = taille + "px";
            point.style.height = taille + "px";


            // Durée de descente aléatoire
            const vitesse = Math.random() * 8 + 4;

            point.style.animationDuration = vitesse + "s";


            // Délai aléatoire
            point.style.animationDelay =
                "-" + Math.random() * vitesse + "s";


            // Opacité aléatoire
            point.style.opacity =
                Math.random() * 0.8 + 0.2;


            // Ajout à la page
            particles.appendChild(point);
        }

    </script>
    <script src="index.js"></script>

</body>
</html>
